name: payment-booking # change this to your app name
services:
  paymeny-service: # change this to your service name
    container_name: payment-service # change this to your service name
    # image: rakaprdana/payment-service:1 # change this to your image name
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8003:8003" # change this to your port
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
